[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "geospsr"
version = "0.1"
authors = [
    { name = "Sidhanth Holalkere", email = "sh844@cornell.edu" },
]

description = "Stochastic Poisson Surface Reconstruction with One Solve using Geometric Gaussian Processes"
requires-python = ">3.9"

dependencies = [
    "jax",
    "flax",
    "tqdm",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
package-dir = {"geospsr" = "geospsr"}

[tool.uv]
exclude-newer = "2025-05-19T00:00:00Z"

[tool.uv.sources]
meshplot = { git = "https://github.com/skoch9/meshplot" }

[dependency-groups]
dev = [
    "gpytoolbox>=0.3.3",
    "huggingface-hub>=0.31.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "jupytext>=1.17.1",
    "libigl<2.5.4",
    "matplotlib>=3.9.4",
    "meshplot",
    "open3d>=0.19.0",
    "pybind11-stubgen>=2.5.4",
    "pyprojroot>=0.3.0",
    "pythreejs>=2.4.2",
]
